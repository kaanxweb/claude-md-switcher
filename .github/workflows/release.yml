# Tag-triggered release build for ClaudeMDSwitcher.
#
# Triggers on any tag matching v*.*.*. The job runs on macos-14 (arm64),
# compiles, generates the AppIcon.icns, and produces
# ClaudeMDSwitcher-v<VERSION>-arm64.zip which gets attached to a GitHub
# Release for that tag.
#
# Signing & notarization:
#   - If APPLE_TEAM_ID + APPLE_ID + APPLE_APP_PASSWORD are all set as
#     repository secrets, release.sh performs Developer ID signing,
#     notarytool submission, and stapling — the resulting zip will not
#     trigger Gatekeeper warnings.
#   - If any secret is missing (currently the case), release.sh falls
#     back to ad-hoc signing and prints a clearly-formatted warning to
#     stdout. The zip still publishes, but users will need to right-click
#     -> Open on first launch to bypass Gatekeeper.
#   - To enable notarization later: repo Settings -> Secrets and variables
#     -> Actions -> add the three secrets. No workflow change needed.
#
# Release notes: prefers .github/release-notes-<VERSION>.md if it exists;
# otherwise softprops/action-gh-release auto-generates a notes block from
# commits since the previous tag.

name: Release
on:
  push:
    tags: ['v*.*.*']

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./release.sh --version ${{ steps.ver.outputs.version }}

      - name: Locate release notes
        id: notes
        run: |
          NOTES_PATH=".github/release-notes-${{ steps.ver.outputs.version }}.md"
          if [[ -f "$NOTES_PATH" ]]; then
            echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ClaudeMDSwitcher-v${{ steps.ver.outputs.version }}-arm64.zip
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
