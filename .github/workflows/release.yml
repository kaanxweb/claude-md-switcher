name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Swift dependencies without lockfile drift
        run: |
          git ls-files --error-unmatch Package.resolved >/dev/null
          swift package resolve
          git diff --exit-code -- Package.resolved

      - name: Check shell syntax
        run: bash -n build.sh release.sh tests/*.sh

      - name: Run Swift tests
        run: swift test

      - name: Run release-script test
        run: bash tests/test_release_script.sh

      - name: Run bundle-packaging test
        run: bash tests/test_bundle_packaging.sh
